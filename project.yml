name: Calcpace

options:
  bundleIdPrefix: app.calcpace
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true

packages:
  HotwireNative:
    url: https://github.com/hotwired/hotwire-native-ios
    exactVersion: 1.3.1

# MARKETING_VERSION is the version people see (Android's versionName),
# bumped by hand in the release PR; the tag must say the same (v1.0.0).
# CURRENT_PROJECT_VERSION is the build (Android's versionCode): 1 here for
# local and CI builds, and the TestFlight lane replaces it with the latest
# uploaded build + 1. The user agent reads both (Calcpace iOS/1.0.0 (1);).
settings:
  base:
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"

targets:
  Calcpace:
    type: application
    platform: iOS
    sources: [Calcpace]
    dependencies:
      - package: HotwireNative
    # Apple Health: read only (HealthReader), and woken for new workouts
    # (HealthSync's background delivery). Push: the "your run is in"
    # notification. aps-environment comes from APS_ENVIRONMENT below:
    # development for Debug (the simulator, a Mac's Xcode run), production
    # for Release, which is what fastlane archives for TestFlight and the
    # App Store. Written down rather than left to the export step, so the
    # entitlements in the archive match the distribution profile.
    # Sign in with Apple (AppleSignIn): not inert for signing. The App ID
    # app.calcpace.ios needs the capability turned on before `match` makes
    # its profiles, or signed builds fail; the unsigned simulator builds
    # don't care. The native flow needs no Services ID (that is only for
    # sign-in on the web).
    # Associated Domains: calcpace.app's apple-app-site-association names the
    # app (Team ID + bundle ID). webcredentials lets the Google/Strava sign-in
    # session end on https://calcpace.app/app_auth/callback (iOS 17.4's https
    # callback, hence the deployment target); applinks opens the email links
    # (verify the address, reset the password) in the app. On the App ID
    # since 03/11/2026, so the match profiles carry it.
    entitlements:
      path: Support/Calcpace.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        aps-environment: "$(APS_ENVIRONMENT)"
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains:
          - applinks:calcpace.app
          - webcredentials:calcpace.app
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Calcpace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        # Translated in each InfoPlist.strings (calcpace_web's
        # apple_health.card.body).
        # App Store validation wants it with any HealthKit app (ITMS-90683),
        # one that only reads included. Only the UI tests' harness, in debug
        # builds, ever asks to write.
        NSHealthUpdateUsageDescription: "Calcpace doesn't write anything to the Health app."
        NSHealthShareUsageDescription: "Calcpace imports the runs and walks your Apple Watch and running apps (Strava, Nike, Garmin, adidas) save to the Health app. We read only the time, distance, duration, climb, heart rate and route of those workouts."
        # The run recorder (Calcpace/Recorder): location while using the app,
        # kept on with the screen locked by the location background mode
        # (and a CLBackgroundActivitySession) only between Start and Finish.
        # Translated in each InfoPlist.strings (recorder_perm_location_hint of
        # the Android app); RunRecording is the purpose key for precise
        # location when the athlete turned it off.
        NSLocationWhenInUseUsageDescription: "To measure distance and pace. Only while you record."
        # Never asked for (when in use is enough), but App Store validation
        # may want it beside the location background mode.
        NSLocationAlwaysAndWhenInUseUsageDescription: "To measure distance and pace. Only while you record."
        NSLocationTemporaryUsageDescriptionDictionary:
          RunRecording: "To measure distance and pace. Only while you record."
        # fetch: the background refresh that uploads runs recorded offline
        # with the app closed (RecorderUploads.taskId).
        UIBackgroundModes: [location, fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.calcpace.ios.recorder-upload]
        # The app icon's long press: "Record a run" (RecorderScreen); the
        # title is the key of its translation in InfoPlist.strings.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: app.calcpace.ios.record
            UIApplicationShortcutItemTitle: "Record a run"
            UIApplicationShortcutItemIconSymbolName: figure.run
        # The site is light only: a dark clock everywhere, whatever iOS 26's
        # bars make of the page under them.
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.calcpace.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production

  CalcpaceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CalcpaceTests]
    dependencies:
      - target: Calcpace
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.calcpace.ios.tests

  CalcpaceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CalcpaceUITests]
    dependencies:
      - target: Calcpace
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.calcpace.ios.uitests

schemes:
  Calcpace:
    build:
      targets:
        Calcpace: all
    test:
      targets:
        - CalcpaceTests
        - CalcpaceUITests

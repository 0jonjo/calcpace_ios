name: Calcpace

options:
  bundleIdPrefix: app.calcpace
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  HotwireNative:
    url: https://github.com/hotwired/hotwire-native-ios
    exactVersion: 1.3.1

settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"

targets:
  Calcpace:
    type: application
    platform: iOS
    sources: [Calcpace]
    dependencies:
      - package: HotwireNative
    # Apple Health: read only (HealthReader), and woken for new workouts
    # (HealthSync's background delivery). Push: the "your run is in"
    # notification, from APNs' development environment; the App Store
    # build's distribution profile turns it into production when the
    # archive is signed (I0). Sign in with Apple (AppleSignIn): not inert
    # for signing. The App ID app.calcpace.ios needs the capability turned
    # on before `match` makes its profiles, or signed builds fail; the
    # unsigned simulator builds don't care. The native flow needs no
    # Services ID (that is only for sign-in on the web).
    entitlements:
      path: Support/Calcpace.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        aps-environment: development
        com.apple.developer.applesignin: [Default]
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Calcpace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        # Translated in each InfoPlist.strings (calcpace_web's
        # apple_health.card.body).
        # App Store validation wants it with any HealthKit app (ITMS-90683),
        # one that only reads included. Only the UI tests' harness, in debug
        # builds, ever asks to write.
        NSHealthUpdateUsageDescription: "Calcpace doesn't write anything to the Health app."
        NSHealthShareUsageDescription: "Calcpace imports the runs and walks your Apple Watch and running apps (Strava, Nike, Garmin, adidas) save to the Health app. We read only the time, distance, duration, climb and heart rate of those workouts."
        # The site is light only: a dark clock everywhere, whatever iOS 26's
        # bars make of the page under them.
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.calcpace.ios
        TARGETED_DEVICE_FAMILY: "1"

  CalcpaceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CalcpaceTests]
    dependencies:
      - target: Calcpace
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.calcpace.ios.tests

  CalcpaceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CalcpaceUITests]
    dependencies:
      - target: Calcpace
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.calcpace.ios.uitests

schemes:
  Calcpace:
    build:
      targets:
        Calcpace: all
    test:
      targets:
        - CalcpaceTests
        - CalcpaceUITests

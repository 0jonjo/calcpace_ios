name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 40
    # A phone with a home button and a flat status bar, and one with the
    # Dynamic Island, whose status bar is taller and covers the page's top
    # when the app hides its navigation bar (the tab roots).
    strategy:
      fail-fast: false
      matrix:
        include:
          - phone: se
            names: "^iPhone SE"
          - phone: island
            names: "^iPhone [0-9]+( Pro)?$"
    name: test (${{ matrix.phone }})
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Generate the Xcode project
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install xcodegen
          xcodegen generate

      # An iPhone whose name matches the matrix's pattern, on the runtime of
      # the selected Xcode's simulator SDK, else the newest runtime below it.
      # Device names change with every Xcode, so none is written down here.
      - name: Boot a simulator
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "Simulator SDK $sdk"
          udid=$(xcrun simctl list devices available -j | jq -r --arg sdk "$sdk" --arg names "${{ matrix.names }}" '
            def version: capture("iOS-(?<a>[0-9]+)-(?<b>[0-9]+)") | [(.a | tonumber), (.b | tonumber)];
            ($sdk | split(".") | map(tonumber) | .[0:2]) as $max
            | [.devices | to_entries[]
               | select(.key | test("iOS-[0-9]+-[0-9]+"))
               | select((.key | version) <= $max)
               | . as $runtime
               | .value[] | select(.name | test($names))
               | {udid, v: ($runtime.key | version)}]
            | sort_by(.v) | last | .udid // empty')
          [ -n "$udid" ] || { echo "no simulator matching ${{ matrix.names }} for iOS $sdk"; xcrun simctl list devices available; exit 1; }
          xcrun simctl list devices | grep "$udid"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      # Built first, so the video holds the app and not three minutes of
      # the home screen while Xcode compiles.
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project Calcpace.xcodeproj \
            -scheme Calcpace \
            -destination "id=$SIMULATOR" \
            -derivedDataPath build

      # The tests run a debug build; this keeps the release one compiling
      # (what is behind #if DEBUG: the UI tests' Apple Health harness).
      - name: Build for release
        if: matrix.phone == 'se'
        run: |
          xcodebuild build \
            -project Calcpace.xcodeproj \
            -scheme Calcpace \
            -configuration Release \
            -destination "id=$SIMULATOR" \
            -derivedDataPath build-release \
            CODE_SIGNING_ALLOWED=NO

      # simulator.mp4 is the whole run, installs included; app.mp4 is cut to
      # the UI tests, by the clock: when the recorder said it started, and
      # when xcodebuild printed the UI suite's start and end.
      - name: Test, recording the simulator
        run: |
          mkdir -p artifacts
          xcrun simctl io "$SIMULATOR" recordVideo --codec=h264 --force artifacts/simulator.mp4 > artifacts/recorder.log 2>&1 &
          recorder=$!
          for _ in $(seq 1 30); do
            grep -q "Recording started" artifacts/recorder.log && { date +%s > artifacts/recording_start; break; }
            sleep 1
          done
          set +e
          xcodebuild test-without-building \
            -project Calcpace.xcodeproj \
            -scheme Calcpace \
            -destination "id=$SIMULATOR" \
            -derivedDataPath build \
            -resultBundlePath artifacts/Calcpace.xcresult 2>&1 |
            while IFS= read -r line; do
              echo "$line"
              case "$line" in
                *"Suite 'CalcpaceUITests.xctest' started"*) date +%s > artifacts/ui_start ;;
                *"Suite 'CalcpaceUITests.xctest' passed"*|*"Suite 'CalcpaceUITests.xctest' failed"*) date +%s > artifacts/ui_end ;;
              esac
            done
          status=${PIPESTATUS[0]}
          # SIGINT lets simctl finish the file; a recorder that ignores it
          # must not hold the job until the timeout.
          kill -INT "$recorder" 2>/dev/null
          for _ in $(seq 1 15); do kill -0 "$recorder" 2>/dev/null || break; sleep 1; done
          kill -9 "$recorder" 2>/dev/null
          wait "$recorder" 2>/dev/null
          exit $status

      - name: Cut the video to the UI tests
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          [ -f artifacts/simulator.mp4 ] && [ -f artifacts/recording_start ] && [ -f artifacts/ui_start ] || exit 0
          [ -f artifacts/ui_end ] || date +%s > artifacts/ui_end
          start=$(( $(cat artifacts/ui_start) - $(cat artifacts/recording_start) - 2 ))
          [ "$start" -ge 0 ] || start=0
          duration=$(( $(cat artifacts/ui_end) - $(cat artifacts/ui_start) + 4 ))
          echo "app.mp4: from ${start}s, ${duration}s long"
          avconvert --source artifacts/simulator.mp4 --output artifacts/app.mp4 \
            --preset PresetHighestQuality --start "$start" --duration "$duration" --replace ||
            { rm -f artifacts/app.mp4; echo "::warning::could not cut the video; simulator.mp4 has it all"; }

      - name: Export the test screenshots
        if: always()
        run: |
          if [ -d artifacts/Calcpace.xcresult ]; then
            mkdir -p artifacts/screenshots
            xcrun xcresulttool export attachments \
              --path artifacts/Calcpace.xcresult \
              --output-path artifacts/screenshots
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-${{ matrix.phone }}
          path: artifacts
          retention-days: 14

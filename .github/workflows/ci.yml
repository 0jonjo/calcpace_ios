name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # The newest iOS runtime on the runner, and an iPhone on it. Names
      # change with every Xcode, so none is written down here.
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries | sort_by(.key)[]
             | select(.key | test("iOS"))
             | .value[] | select(.name | test("^iPhone"))]
            | last | .udid')
          test -n "$udid" && test "$udid" != null
          xcrun simctl list devices | grep "$udid"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Build and test, recording the simulator
        run: |
          mkdir -p artifacts
          xcrun simctl io "$SIMULATOR" recordVideo --codec=h264 --force artifacts/simulator.mp4 &
          recorder=$!
          sleep 2
          set +e
          xcodebuild test \
            -project Calcpace.xcodeproj \
            -scheme Calcpace \
            -destination "id=$SIMULATOR" \
            -resultBundlePath artifacts/Calcpace.xcresult
          status=$?
          kill -INT "$recorder"
          wait "$recorder"
          exit $status

      - name: Export the test screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments \
            --path artifacts/Calcpace.xcresult \
            --output-path artifacts/screenshots || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator
          path: artifacts
          retention-days: 14

name: tmp verify (dropped before PR)
on:
  push:
    branches: [feat/testflight]
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec fastlane lanes
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
      - env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen && xcodegen generate
      - run: |
          for c in Debug Release; do
            echo "== $c"
            xcodebuild -project Calcpace.xcodeproj -target Calcpace -configuration $c -sdk iphonesimulator -showBuildSettings | grep -E " APS_ENVIRONMENT | CURRENT_PROJECT_VERSION "
            xcodebuild build -quiet -project Calcpace.xcodeproj -scheme Calcpace -configuration $c \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath dd-$c CURRENT_PROJECT_VERSION=42
            find dd-$c -name "*.xcent" -print -exec plutil -p {} \;
            app=$(find dd-$c/Build/Products -maxdepth 2 -name Calcpace.app | head -1)
            plutil -p "$app/Info.plist" | grep -E "CFBundleVersion|CFBundleShortVersionString"
          done
